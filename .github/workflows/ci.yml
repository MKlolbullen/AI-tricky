name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cai_sdk:
        description: Run the optional CAI SDK fixture tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt uro==1.0.2
      - run: python scripts/migrate-catalog.py --check
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  identity-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m venv .venv-identity
      - run: .venv-identity/bin/python -m pip install impacket==0.13.1
      - run: python scripts/fetch-identity-ci-tool.py .identity-ci-tools
      - run: python -m pytest backend/tests/test_identity_cli_real.py -q
        env:
          AI_TRICKY_IMPACKET_BIN: ${{ github.workspace }}/.venv-identity/bin
          AI_TRICKY_AZUREHOUND_BIN: ${{ github.workspace }}/.identity-ci-tools/azurehound
      - run: |
          identity_check_python="$(command -v python)"
          PATH="$PWD/.venv-identity/bin:$PWD/.identity-ci-tools:$PATH" "$identity_check_python" scripts/check-identity-tools.py

  web-recon-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.4'
          cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: |
          scripts/install-tools.sh --web-recon --yes --skip-toolchains --prefix="$RUNNER_TEMP/web-recon"
      - run: |
          PATH="$RUNNER_TEMP/web-recon/bin:$PATH" python scripts/check-recon-tools.py
          AI_TRICKY_RECON_BIN="$RUNNER_TEMP/web-recon/bin" python -m pytest backend/tests/test_web_recon_real.py -q
      - run: |
          scripts/install-tools.sh --trickest-oss --yes --skip-toolchains --prefix="$RUNNER_TEMP/trickest-oss"
          AI_TRICKY_TRICKEST_BIN="$RUNNER_TEMP/trickest-oss/bin" python -m pytest backend/tests/test_trickest_pack.py -q

  optional-cai:
    if: github.event_name == 'workflow_dispatch' && inputs.cai_sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cai.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m venv .venv-cai
      - run: .venv-cai/bin/python -m pip install -r requirements-cai.lock
      - run: CAI_TEST_PYTHON="$PWD/.venv-cai/bin/python" .venv-cai/bin/python -m pytest backend/tests/test_cai_sdk.py backend/tests/test_cai_usage_sdk.py backend/tests/test_team_routing_sdk.py -q

  burp-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: integrations/burp-bridge/pom.xml
      - run: mvn -B -ntp -f integrations/burp-bridge/pom.xml verify
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: integrations/burp-bridge/target/ai-tricky-burp-bridge.jar
          archive: false
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - name: Prepare browser
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "AI_TRICKY_TEST_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run build
      - run: npm run test:browser

