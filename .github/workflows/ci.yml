name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cai_sdk:
        description: Run the optional CAI SDK fixture tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt uro==1.0.2
      - run: python scripts/migrate-catalog.py --check
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  identity-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m venv .venv-identity
      - run: .venv-identity/bin/python -m pip install impacket==0.13.1
      - run: python scripts/fetch-identity-ci-tool.py .identity-ci-tools
      - run: python -m pytest backend/tests/test_identity_cli_real.py -q
        env:
          AI_TRICKY_IMPACKET_BIN: ${{ github.workspace }}/.venv-identity/bin
          AI_TRICKY_AZUREHOUND_BIN: ${{ github.workspace }}/.identity-ci-tools/azurehound
      - run: PATH="$PWD/.venv-identity/bin:$PWD/.identity-ci-tools:$PATH" python scripts/check-identity-tools.py

  optional-cai:
    if: github.event_name == 'workflow_dispatch' && inputs.cai_sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cai.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m venv .venv-cai
      - run: .venv-cai/bin/python -m pip install -r requirements-cai.lock
      - run: CAI_TEST_PYTHON="$PWD/.venv-cai/bin/python" .venv-cai/bin/python -m pytest backend/tests/test_cai_sdk.py backend/tests/test_cai_usage_sdk.py backend/tests/test_team_routing_sdk.py -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser

