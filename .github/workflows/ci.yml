name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cai_sdk:
        description: Run the optional CAI SDK fixture tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt uro==1.0.2
      - run: python scripts/migrate-catalog.py --check
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  identity-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m venv .venv-identity
      - run: .venv-identity/bin/python -m pip install impacket==0.13.1
      - run: python scripts/fetch-identity-ci-tool.py .identity-ci-tools
      - run: python -m pytest backend/tests/test_identity_cli_real.py -q
        env:
          AI_TRICKY_IMPACKET_BIN: ${{ github.workspace }}/.venv-identity/bin
          AI_TRICKY_AZUREHOUND_BIN: ${{ github.workspace }}/.identity-ci-tools/azurehound
      - run: |
          identity_check_python="$(command -v python)"
          PATH="$PWD/.venv-identity/bin:$PWD/.identity-ci-tools:$PATH" "$identity_check_python" scripts/check-identity-tools.py

  web-recon-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.4'
          cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: |
          scripts/install-tools.sh --web-recon --yes --skip-toolchains --prefix="$RUNNER_TEMP/web-recon"
      - run: |
          PATH="$RUNNER_TEMP/web-recon/bin:$PATH" python scripts/check-recon-tools.py
          AI_TRICKY_RECON_BIN="$RUNNER_TEMP/web-recon/bin" python -m pytest backend/tests/test_web_recon_real.py -q
          AI_TRICKY_RECON_BIN="$RUNNER_TEMP/web-recon/bin" AI_TRICKY_ARG_HELP_REQUIRED=subfinder,httprobe,katana,nuclei python -m pytest backend/tests/test_tool_argument_overlay.py -q
      - run: |
          scripts/install-tools.sh --trickest-oss --yes --skip-toolchains --prefix="$RUNNER_TEMP/trickest-oss"
          AI_TRICKY_TRICKEST_BIN="$RUNNER_TEMP/trickest-oss/bin" python -m pytest backend/tests/test_trickest_pack.py -q
      - name: Verify the argument overlay against pinned httpx, dnsx, urlfinder and gau
        run: |
          scripts/install-tools.sh --recon-extras --yes --skip-toolchains --prefix="$RUNNER_TEMP/recon-extras"
          PATH="$RUNNER_TEMP/recon-extras/bin:$PATH" python scripts/check-recon-tools.py --profile recon-extras
          AI_TRICKY_ARG_HELP_BIN="$RUNNER_TEMP/recon-extras/bin" AI_TRICKY_ARG_HELP_REQUIRED=httpx,dnsx,urlfinder,gau python -m pytest backend/tests/test_tool_argument_overlay.py -q

  enforced-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.4'
          cache: false
      - name: Install Bubblewrap for the runner
        run: |
          sudo apt-get -o Acquire::Retries=2 install --yes --no-install-recommends bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo apparmor_parser -r <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          fi
          bwrap --unshare-user --unshare-net --disable-userns --ro-bind / / -- /usr/bin/true
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify pinned scanners and network isolation on loopback fixtures
        env:
          GOTOOLCHAIN: local
        run: |
          scripts/install-tools.sh --enforced-cli --yes --skip-toolchains --prefix="$RUNNER_TEMP/scoped-cli"
          export AI_TRICKY_SCOPE_BIN="$RUNNER_TEMP/scoped-cli/bin"
          export AI_TRICKY_FFUF_BIN="$AI_TRICKY_SCOPE_BIN/ffuf"
          CGO_ENABLED=0 go build -trimpath -o "$AI_TRICKY_SCOPE_BIN/isolation-probe" backend/tests/fixtures/cli-scope-probe.go
          python -m pytest backend/tests/test_cli_scope.py -q
          AI_TRICKY_ARG_HELP_REQUIRED=ffuf,katana,nuclei python -m pytest backend/tests/test_tool_argument_overlay.py -q

  linux-scanner-beta:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.4'
          cache: false
      - run: npm ci
      - run: scripts/build-binary.sh
      - run: scripts/package-linux-beta.sh
      - name: Smoke-test the extracted beta
        run: |
          archive=ai-tricky-linux-amd64-beta.tar.gz
          (cd dist-bin && sha256sum -c "$archive.sha256")
          mkdir -p "$RUNNER_TEMP/scanner-beta" "$RUNNER_TEMP/scanner-beta-home"
          tar -xf "dist-bin/$archive" -C "$RUNNER_TEMP/scanner-beta"
          cd "$RUNNER_TEMP/scanner-beta/ai-tricky-linux-amd64-beta"
          export HOME="$RUNNER_TEMP/scanner-beta-home" AI_TRICKY_DATA_DIR="$RUNNER_TEMP/scanner-beta-data"
          export AI_TRICKY_PORT=8794
          ./scripts/install-tools.sh --enforced-cli --yes --skip-toolchains
          ./ai-tricky &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" || true' EXIT
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8794/api/scanner-profiles -o profiles.json
          python - <<'PY'
          import json
          from pathlib import Path
          profiles = json.loads(Path('profiles.json').read_text())['profiles']
          tools = next(profile['tools'] for profile in profiles if profile['id'] == 'enforced-cli')
          assert {tool['tool_id'] for tool in tools} == {'ffuf', 'httprobe', 'katana', 'nuclei'}
          for tool in tools:
              assert tool['status'] == 'tested_version', tool
              assert Path(tool['path']).parent == Path(tool['default_bin']), tool
          PY
          curl -fsS -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8794/api/support-data/install/bundled -o /dev/null
          curl -fsS http://127.0.0.1:8794/ -o /dev/null
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-scanner-beta
          path: |
            dist-bin/ai-tricky-linux-amd64-beta.tar.gz
            dist-bin/ai-tricky-linux-amd64-beta.tar.gz.sha256
          if-no-files-found: error

  optional-cai:
    if: github.event_name == 'workflow_dispatch' && inputs.cai_sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cai.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m venv .venv-cai
      - run: .venv-cai/bin/python -m pip install -r requirements-cai.lock
      - run: CAI_TEST_PYTHON="$PWD/.venv-cai/bin/python" .venv-cai/bin/python -m pytest backend/tests/test_cai_sdk.py backend/tests/test_cai_usage_sdk.py backend/tests/test_team_routing_sdk.py -q

  burp-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: integrations/burp-bridge/pom.xml
      - run: mvn -B -ntp -f integrations/burp-bridge/pom.xml verify
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: integrations/burp-bridge/target/ai-tricky-burp-bridge.jar
          archive: false
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - name: Prepare browser
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "AI_TRICKY_TEST_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run build
      - run: npm run test:browser

